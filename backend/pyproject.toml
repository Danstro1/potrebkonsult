[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "potrebkonsult-backend"
version = "0.1.0"
description = "Backend ассистента по защите прав потребителей"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "pgvector==0.5.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "anyio==4.15.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
