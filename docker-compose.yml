services:
  db:
    image: pgvector/pgvector:pg16
    container_name: potreb-pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-potrebkonsult}
      POSTGRES_USER: ${POSTGRES_USER:-potreb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
